name: Check and build Safari (Via CN)

on:
  # Two small JSON checks per week. Only new upstream versions trigger APK work.
  schedule:
    - cron: "27 4 * * 2,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: via-safari-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Via official JSON and existing GitHub Release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_latest.py
      - name: Save upstream manifest for build job
        if: steps.check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-manifest
          path: work/upstream.json
          retention-days: 1

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: upstream-manifest
          path: work
      - name: Validate signing secrets before downloading tools
        shell: bash
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "::error::Set secret SIGNING_KEYSTORE_BASE64"; exit 1; }
          test -n "$SIGNING_PASSWORD" || { echo "::error::Set secret SIGNING_PASSWORD"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Fetch official APK and pinned Apktool
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/download_apk.py
          curl --fail --location --silent --show-error --retry 3 \
            -o "$RUNNER_TEMP/apktool.jar" \
            "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar"
          java -jar "$RUNNER_TEMP/apktool.jar" --version
      - name: Decode, change launcher branding, version and update URL, rebuild
        shell: bash
        run: |
          set -euo pipefail
          java -jar "$RUNNER_TEMP/apktool.jar" d -f "work/upstream.apk" -o work/decoded
          python3 scripts/patch_apk.py --decoded work/decoded --version "${{ needs.check.outputs.version }}"
          java -jar "$RUNNER_TEMP/apktool.jar" b work/decoded -o work/unsigned.apk
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('work/unsigned.apk') as apk:
              dex = b''.join(apk.read(name) for name in apk.namelist() if name.endswith('.dex'))
          assert b'https://raw.githubusercontent.com/Scluzlep/via-safari/main/latest_cn.json' in dex
          assert b'https://res.viayoo.com/v1/latest_cn.json' not in dex
          print('Rebuilt DEX update URL verified')
          PY
      - name: Zipalign, sign, verify
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$BUILD_TOOLS"
          mkdir -p out
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/safari.p12"
          "$BUILD_TOOLS/zipalign" -f -p 4 work/unsigned.apk work/aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/safari.p12" --ks-type PKCS12 \
            --ks-key-alias safari \
            --ks-pass env:SIGNING_PASSWORD \
            --key-pass env:SIGNING_PASSWORD \
            --out out/Safari.apk work/aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs out/Safari.apk
          "$BUILD_TOOLS/aapt" dump badging out/Safari.apk | tee work/badging.txt
          grep -q "package: name='mark.via' versionCode='${{ needs.check.outputs.version }}'" work/badging.txt
          grep -q "application-label:'Safari'" work/badging.txt
          grep -q "launchable-activity:" work/badging.txt
          rm -f "$RUNNER_TEMP/safari.p12"
      - name: Generate modified update manifest
        run: python3 scripts/publish_json.py "${{ needs.check.outputs.version }}" out/Safari.apk
      - name: Publish APK Release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ needs.check.outputs.tag }}" \
            "out/Safari.apk#Safari.apk" \
            "latest_cn.json#latest_cn.json" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Safari (Via CN) ${{ needs.check.outputs.version }}" \
            --notes "Unofficial rebrand of the official Via CN APK. Package: mark.via. Launcher: Safari (iOS 26 icon). Update feed: this repository. Keep your signing key backed up."
      - name: Publish update JSON to stable raw.githubusercontent.com URL
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_cn.json
          git commit -m "chore: publish Safari update ${{ needs.check.outputs.version }}"
          git push origin "HEAD:main"
